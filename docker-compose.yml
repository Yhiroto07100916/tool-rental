services:
  mysql:
    image: mysql:8.4
    container_name: tool-rental-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tool_rental
      MYSQL_USER: tool_rental
      MYSQL_PASSWORD: tool_rental
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
